# rv32_core ISA with ENABLE_M=1 (docs/spec/core.md section 4.7).
# M-mode only, direct mtvec, no misaligned access support (traps).
hart_ids: [0]
hart0:
  ISA: RV32IMZicsr_Zifencei
  physical_addr_sz: 32
  User_Spec_Version: '2.3'
  Privilege_Spec_Version: '1.11'
  supported_xlen: [32]
  hw_data_misaligned_support: false
  misa:
    reset-val: 0x40001100
    rv32:
      accessible: true
      mxl:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - mxl[1:0] in [0x1]
            wr_illegal:
              - Unchanged
      extensions:
        implemented: true
        type:
          warl:
            dependency_fields: []
            legal:
              - extensions[25:0] bitmask [0x0001100, 0x0000000]
            wr_illegal:
              - Unchanged

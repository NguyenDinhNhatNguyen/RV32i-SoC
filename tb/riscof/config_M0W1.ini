# RISCOF cho rv32_core ENABLE_M=0, chạy từ thư mục tb/riscof (make arch-core).
[RISCOF]
ReferencePlugin=spike_ref
ReferencePluginPath=spike_ref
DUTPlugin=rv32_core
DUTPluginPath=rv32_core

[rv32_core]
pluginpath=rv32_core
ispec=rv32_core/rv32_core_isa_M0.yaml
pspec=rv32_core/rv32_core_platform.yaml
tb_cfg=M0W1
target_run=1
jobs=8

[spike_ref]
pluginpath=spike_ref
prefix=riscv64-unknown-elf
jobs=8
